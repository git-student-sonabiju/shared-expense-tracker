spring.application.name=shared-expense-tracker
server.port=8080

# File-based H2 database so data survives server restarts. Override with SPRING_DATASOURCE_* env vars
# (e.g. a PostgreSQL URL) for a real deployment; the PostgreSQL driver is already on the classpath.
spring.datasource.url=jdbc:h2:file:./data/expenses
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Reject JSON fields the API does not know about instead of silently ignoring them.
spring.jackson.deserialization.fail-on-unknown-properties=true

app.cors.allowed-origins=http://localhost:5173

# How long a login session stays valid (ISO-8601 or simple form like 7d, 12h).
app.auth.session-ttl=7d
